name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Task 42: 3.10 = declared minimum (requires-python) + dev machine;
        # 3.13 = newly supported (help-golden spacing handled by the
        # version-independent normalizer). macOS runs the unit + golden
        # suites in the dedicated jobs below.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # v0.6.0: the plugin decision tests (test_plugin_server_launch.py,
      # test_sidecar_privacy.py) run the real roampal.ts code under Node via
      # stripTypeScriptTypes, which needs Node >= 22.13. Runner images ship
      # Node 20, so without this step those tests skip.
      - name: Set up Node 22 (plugin decision tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # v0.6.0 Task 29: the dedup guard runs one test against the REAL
      # mpnet-INT8 embedder (skip-if-uncached elsewhere, so it never blocks a
      # cold local checkout). CI primes the two model files into the HF cache
      # and action-cache persists them across runs.
      - name: Restore HF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-mpnet-qint8-dedup-v1
      - name: Prime mpnet-INT8 into HF cache (download only on miss)
        # Verbose on purpose (Task 28): a silent prime left the macOS forked
        # children cache-missing and aborting. Assert both files landed.
        run: |
          python - <<'EOF'
          import os
          import huggingface_hub as h
          from roampal.backend.modules.memory import embedding_service as es
          paths = [h.hf_hub_download(repo_id=es.HF_REPO, filename=f)
                   for f in (es.ONNX_FILE, es.TOKENIZER_FILE)]
          for p in paths:
              size = os.path.getsize(p)
              print(f"PRIMED {p} ({size} bytes)")
              assert size > 0, f"prime produced an empty file: {p}"
          EOF

      - name: Run tests
        timeout-minutes: 10
        env:
          # WAL-enabled SQLite does not survive os.fork() cleanly on the GH
          # Actions Linux runners (inherited fd/shared-memory mappings cause
          # disk I/O errors during ChromaDB compaction). WAL tests run in a
          # separate in-process job below.
          ROAMPAL_TEST_DISABLE_WAL: "1"
          # The model files are primed into the HF cache above; without this
          # huggingface_hub still does a network metadata check per load. In
          # a forked child on macOS that call reaches urllib's
          # getproxies_macosx_sysconf, which is not fork-safe and aborts the
          # child (SIGABRT). Offline mode keeps every forked child cache-only.
          HF_HUB_OFFLINE: "1"
          # Let the unit-suite sandbox point forked children at the primed
          # cache above (read-only). Without it the sandboxed children see an
          # empty cache and every model load takes the network-miss path.
          ROAMPAL_TEST_PRIME_HF_CACHE: "1"
        # --forked: each test in its own subprocess so RAM (esp. ONNX models
        # at ~420MB each) is fully released between tests. Without this the
        # 27+ tests that call await ums.initialize() in test_unified_memory_system.py
        # accumulate enough RSS on the GH runner to trigger SIGTERM/OOM at
        # the 80% mark. Linux/macOS only (uses os.fork); Windows local runs
        # use the standard in-process pytest path.
        # --timeout=60: per-test cap so a hung test self-reports with a name.
        # -m "not wal": WAL tests run in the dedicated wal-tests job.
        run: pytest --tb=short -q --timeout=60 --forked -m "not wal"

  golden-tests:
    # v0.6.0 Task 27: the CLI golden suite must hold on BOTH platform
    # families — it is the byte-level contract for every refactor, so a
    # Windows-only or Linux-only normalization gap has to be caught here.
    # Task 42: matrix extended to 3.10-3.13 and macOS (the argparse layout
    # the goldens pin is now version-independent via the Task 42 normalizer).
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run golden CLI suite
        timeout-minutes: 10
        # The suite subprocess-isolates the child per case (its own
        # APPDATA/HOME/XDG, pinned PYTHONIOENCODING), so no --forked and no
        # WAL restriction. The _normalizer maps platform dirs/separators to
        # placeholders so one set of goldens covers all matrices, and (Task
        # 42) joins argparse's wrapped rows + collapses column gaps so the
        # 3.13 layout change cannot flip it.
        run: pytest --tb=short -q --timeout=60 roampal/backend/modules/memory/tests/unit/test_cli_golden.py

  unit-tests-macos:
    # Task 42: macOS has never been tested; run the same selection as the
    # main Linux job (unit suite; WAL tests stay in their dedicated jobs,
    # integration in theirs). Same --forked OOM guard as the Linux job.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Set up Node 22 (plugin decision tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore HF model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-mpnet-qint8-dedup-v1
      - name: Prime mpnet-INT8 into HF cache (download only on miss)
        # Same verified prime as the Linux job above.
        run: |
          python - <<'EOF'
          import os
          import huggingface_hub as h
          from roampal.backend.modules.memory import embedding_service as es
          paths = [h.hf_hub_download(repo_id=es.HF_REPO, filename=f)
                   for f in (es.ONNX_FILE, es.TOKENIZER_FILE)]
          for p in paths:
              size = os.path.getsize(p)
              print(f"PRIMED {p} ({size} bytes)")
              assert size > 0, f"prime produced an empty file: {p}"
          EOF

      - name: Run tests
        timeout-minutes: 15
        env:
          ROAMPAL_TEST_DISABLE_WAL: "1"
          # Fork-safety on macOS: a network metadata check by
          # huggingface_hub inside a forked child hits urllib's
          # getproxies_macosx_sysconf, which aborts the child (SIGABRT).
          # The model is primed into the HF cache above; keep children
          # strictly cache-only.
          HF_HUB_OFFLINE: "1"
          # Same primed-cache reach-through as the Linux job above.
          ROAMPAL_TEST_PRIME_HF_CACHE: "1"
        run: pytest --tb=short -q --timeout=60 --forked -m "not wal"

  wal-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run WAL tests
        timeout-minutes: 10
        # In-process only: WAL + fork causes SQLite I/O errors on Linux CI.
        # This job is the production WAL/crash-recovery gate.
        run: pytest --tb=short -q --timeout=60 -m "wal"

  wal-tests-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run WAL and crash recovery tests
        timeout-minutes: 15
        run: pytest --tb=short -q --timeout=60 -m "wal"

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      # Task 28 diagnosis: fail-fast cancelled the sibling versions before
      # they could speak; run 3 showed the whole ubuntu integration matrix
      # failing with the same SQLite disk-I/O errors, so keep the matrix
      # independent from here on.
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests
        timeout-minutes: 15
        env:
          # Task 28 (2026-09-26): three consecutive runs failed the whole
          # ubuntu integration matrix (not one version) with SQLite
          # disk-I/O errors (code 522) during ChromaDB compaction on the
          # WAL-enabled write cycles (archive/sweep/routing). The same
          # files pass with WAL disabled in the main job on the same
          # runners, and the WAL behavior itself stays gated by the
          # wal-tests job here and integration-tests-windows below. Treat
          # WAL-on-Linux-runner as an infra limitation until chromadb
          # upstream says otherwise.
          ROAMPAL_TEST_DISABLE_WAL: "1"
        # v0.6.0 Task 0b (comment corrected by Task 33): root testpaths
        # ("roampal") DID collect these files already — the original
        # "never collected" claim was true only of a cwd whose rootdir
        # resolved to the nested tests/pytest.ini (see P1 correction).
        # What this job adds: an EXPLICIT CONTRACT (coverage no longer
        # depends on root testpaths drift) plus the 30 non-wal tests
        # running on Windows CI for the first time. No --forked (the WAL
        # crash-recovery tests need a real in-process SQLite/Chroma
        # connection). WAL is disabled here since Task 28 (see env note
        # above); the WAL-enabled integration coverage lives in
        # integration-tests-windows. Explicit path also overrides
        # testpaths, so this collects the whole directory regardless of
        # what pytest.ini lands the default on.
        run: pytest --tb=short -q --timeout=120 roampal/backend/modules/memory/tests/integration

  integration-tests-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run integration tests
        timeout-minutes: 20
        run: pytest --tb=short -q --timeout=120 roampal/backend/modules/memory/tests/integration

  plugin-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify OpenCode plugin parses
        run: bun build roampal/plugins/opencode/roampal.ts --outdir /tmp/plugin-out --target bun --packages external

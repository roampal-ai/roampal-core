[pytest]
asyncio_mode = auto
testpaths = unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    wal: WAL-specific tests that must run in-process (not forked)
    crash: subprocess force-termination and recovery tests
    slow: long-running integration gates (RSS soak, real-model runs)
